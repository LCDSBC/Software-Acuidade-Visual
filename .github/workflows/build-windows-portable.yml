name: Build Windows Portable Package

on:
  push:
    branches:
      - "cursor/**"
      - "main"
  pull_request:
  workflow_dispatch:

jobs:
  build-windows-portable:
    name: Build Optotipos Windows package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Build executables
        working-directory: Optotipos
        shell: cmd
        run: build_windows.bat

      - name: Verify portable package
        shell: pwsh
        run: |
          $package = "Optotipos/dist/Optotipos_Portatil"
          if (!(Test-Path "$package/Optotipos.exe")) { throw "Optotipos.exe not found" }
          if (!(Test-Path "$package/Configurador.exe")) { throw "Configurador.exe not found" }
          if (!(Test-Path "$package/Configuracoes/Distancia.txt")) { throw "Distancia.txt not found" }
          if (!(Test-Path "$package/Manual/MANUAL_DE_USO.md")) { throw "Manual not found" }

      - name: Upload Windows portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Optotipos_Profissional_Windows_Portatil
          path: Optotipos/dist/Optotipos_Portatil
          if-no-files-found: error
